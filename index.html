<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Historical Interview System</title>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #05080d;
    color: #dcefff;
    font-family: Arial, "Noto Sans KR", sans-serif;
    overflow: hidden;
}

body {
    display: flex;
    justify-content: center;
    align-items: center;
}

/* 전체 화면 */

#app {
    width: 100vw;
    height: 100vh;
    position: relative;
    overflow: hidden;
    background:
        radial-gradient(circle at center, #101c29 0%, #05080d 65%);
}

/* HUD 선 */

#app::before {
    content: "";
    position: absolute;
    inset: 20px;
    border: 1px solid rgba(100,190,255,0.25);
    pointer-events: none;
}

#app::after {
    content: "";
    position: absolute;
    inset: 30px;
    border: 1px solid rgba(100,190,255,0.08);
    pointer-events: none;
}

/* 시작 화면 */

#startScreen {
    position: absolute;
    inset: 0;
    z-index: 100;
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
    background:
        radial-gradient(circle, #132333 0%, #05080d 70%);
}

.startBox {
    width: min(90%, 700px);
    padding: 40px;
}

.systemTitle {
    font-size: clamp(22px, 4vw, 42px);
    letter-spacing: 5px;
    margin-bottom: 18px;
}

.systemSub {
    color: #78cfff;
    letter-spacing: 3px;
    font-size: clamp(12px, 2vw, 18px);
}

.subject {
    margin-top: 35px;
    font-size: clamp(20px, 3vw, 30px);
    letter-spacing: 4px;
}

.status {
    margin-top: 12px;
    color: #8ea4b8;
}

.startButton {
    margin-top: 45px;
    padding: 17px 40px;
    border: 1px solid #5ecbff;
    background: rgba(50,130,180,0.12);
    color: #dff7ff;
    font-size: 17px;
    letter-spacing: 3px;
    cursor: pointer;
    border-radius: 5px;
}

.startButton:active {
    transform: scale(0.97);
    background: rgba(80,180,230,0.25);
}

/* 메인 인터뷰 */

#mainScreen {
    display: none;
    width: 100%;
    height: 100%;
    padding: 45px;
    position: relative;
}

/* 상단 */

.topBar {
    height: 10%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid rgba(100,190,255,0.2);
}

.topTitle {
    font-size: clamp(13px, 2vw, 20px);
    letter-spacing: 3px;
}

.live {
    color: #65d9ff;
    font-size: 13px;
    letter-spacing: 2px;
}

/* 중앙 */

.centerArea {
    height: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
}

.characterArea {
    width: 38%;
    min-width: 230px;
    height: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
}

.character {
    width: 190px;
    height: 270px;
    position: relative;
    animation: floatCharacter 4s ease-in-out infinite;
}

@keyframes floatCharacter {
    0%,100% {
        transform: translateY(0);
    }
    50% {
        transform: translateY(-6px);
    }
}

/* 정약용 간단 캐릭터 */

.head {
    width: 110px;
    height: 125px;
    border-radius: 50%;
    background: #d4a77c;
    position: absolute;
    left: 40px;
    top: 15px;
}

.hair {
    width: 115px;
    height: 60px;
    background: #181818;
    border-radius: 55% 55% 30% 30%;
    position: absolute;
    left: 38px;
    top: 5px;
}

.hair::after {
    content: "";
    position: absolute;
    width: 15px;
    height: 55px;
    background: #181818;
    left: 50px;
    top: -35px;
    border-radius: 50%;
}

.eye {
    width: 9px;
    height: 9px;
    background: #202020;
    border-radius: 50%;
    position: absolute;
    top: 70px;
}

.eye.left {
    left: 65px;
}

.eye.right {
    right: 65px;
}

.mouth {
    width: 30px;
    height: 5px;
    border-bottom: 2px solid #402d2d;
    position: absolute;
    left: 80px;
    top: 103px;
}

.body {
    width: 170px;
    height: 145px;
    background: #263d50;
    position: absolute;
    left: 10px;
    top: 125px;
    border-radius: 15px 15px 5px 5px;
}

.clothes {
    width: 100px;
    height: 145px;
    background: #182936;
    position: absolute;
    left: 35px;
    top: 0;
    clip-path: polygon(25% 0,75% 0,100% 100%,0 100%);
}

.characterName {
    position: absolute;
    bottom: 15px;
    width: 100%;
    text-align: center;
    letter-spacing: 3px;
    color: #9bdfff;
}

/* 말할 때 */

.character.speaking {
    animation: speaking 0.5s ease-in-out infinite alternate;
}

@keyframes speaking {
    from {
        transform: translateY(0) scale(1);
    }
    to {
        transform: translateY(-4px) scale(1.015);
    }
}

/* 오른쪽 정보 */

.infoArea {
    width: 55%;
    height: 100%;
    padding: 25px;
}

.panelLabel {
    font-size: 12px;
    color: #75cfff;
    letter-spacing: 2px;
    margin-bottom: 10px;
}

.answerPanel {
    height: 100%;
    border: 1px solid rgba(100,190,255,0.3);
    background: rgba(10,20,30,0.65);
    padding: 25px;
    overflow-y: auto;
}

.answerText {
    font-size: clamp(15px, 2vw, 20px);
    line-height: 1.8;
    color: #e6f5ff;
}

/* 질문 */

.questionArea {
    height: 25%;
    display: flex;
    flex-direction: column;
    justify-content: center;
}

.questionBox {
    width: 100%;
    min-height: 65px;
    border: 1px solid rgba(100,190,255,0.35);
    background: rgba(5,12,18,0.8);
    color: white;
    padding: 18px;
    font-size: 16px;
    resize: none;
    outline: none;
    border-radius: 5px;
}

.questionBox:focus {
    border-color: #66d5ff;
}

.questionBox::placeholder {
    color: #637889;
}

/* 버튼 */

.buttonArea {
    height: 15%;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
}

.controlButton {
    min-width: 130px;
    padding: 13px 18px;
    border: 1px solid rgba(100,190,255,0.5);
    background: rgba(40,100,140,0.13);
    color: #d9f4ff;
    border-radius: 5px;
    cursor: pointer;
    font-size: 14px;
}

.controlButton:active {
    transform: scale(0.97);
}

.controlButton.voice {
    border-color: #72dcff;
}

.controlButton.end {
    border-color: #ff8b8b;
}

/* 대화 기록 */

#conversationLog {
    position: absolute;
    width: 300px;
    max-height: 180px;
    right: 45px;
    bottom: 20px;
    overflow-y: auto;
    font-size: 11px;
    color: #7893a6;
    opacity: 0.8;
}

.logItem {
    margin-bottom: 8px;
}

.logQuestion {
    color: #80d7ff;
}

.logAnswer {
    color: #9aabb8;
}

/* 상태 */

#systemStatus {
    position: absolute;
    left: 45px;
    bottom: 20px;
    font-size: 11px;
    color: #6f8798;
}

/* 모바일 */

@media (max-width: 800px) {

    #mainScreen {
        padding: 25px;
    }

    .centerArea {
        height: 48%;
    }

    .characterArea {
        width: 35%;
        min-width: 180px;
    }

    .infoArea {
        width: 65%;
        padding: 10px;
    }

    .character {
        transform: scale(0.8);
    }

    #conversationLog {
        display: none;
    }

    #systemStatus {
        left: 25px;
    }
}

@media (max-width: 600px) {

    #mainScreen {
        padding: 18px;
    }

    .centerArea {
        height: 45%;
    }

    .characterArea {
        display: none;
    }

    .infoArea {
        width: 100%;
    }

    .questionArea {
        height: 30%;
    }

    .buttonArea {
        height: 20%;
    }

    .controlButton {
        min-width: 105px;
        padding: 11px 8px;
    }

    #systemStatus {
        left: 18px;
        bottom: 8px;
    }
}
</style>
</head>

<body>

<div id="app">

    <!-- 시작 화면 -->

    <section id="startScreen">

        <div class="startBox">

            <div class="systemTitle">
                HISTORICAL INTERVIEW SYSTEM
            </div>

            <div class="systemSub">
                ARCHIVE INTERFACE
            </div>

            <div class="subject">
                SUBJECT : JEONG YAG-YONG
            </div>

            <div class="status">
                SYSTEM STATUS : STANDBY
            </div>

            <button class="startButton" id="startButton">
                START INTERVIEW
            </button>

        </div>

    </section>


    <!-- 메인 화면 -->

    <section id="mainScreen">

        <div class="topBar">

            <div class="topTitle">
                HISTORICAL INTERVIEW / LIVE SESSION
            </div>

            <div class="live">
                ● INTERVIEW ACTIVE
            </div>

        </div>


        <div class="centerArea">

            <div class="characterArea">

                <div class="character" id="character">

                    <div class="hair"></div>

                    <div class="head">

                        <div class="eye left"></div>
                        <div class="eye right"></div>
                        <div class="mouth"></div>

                    </div>

                    <div class="body">

                        <div class="clothes"></div>

                    </div>

                    <div class="characterName">
                        정 약 용
                    </div>

                </div>

            </div>


            <div class="infoArea">

                <div class="panelLabel">
                    JEONG YAG-YONG / RESPONSE
                </div>

                <div class="answerPanel">

                    <div class="answerText" id="answerText">
                        반갑네. 궁금한 것이 있다면 물어보게.
                    </div>

                </div>

            </div>

        </div>


        <div class="questionArea">

            <div class="panelLabel">
                INTERVIEWER / QUESTION
            </div>

            <textarea
                id="questionInput"
                class="questionBox"
                placeholder="질문을 입력하거나 '음성 질문' 버튼을 눌러 말해보세요."
            ></textarea>

        </div>


        <div class="buttonArea">

            <button
                class="controlButton voice"
                id="voiceButton">
                🎤 음성 질문
            </button>

            <button
                class="controlButton"
                id="askButton">
                질문하기
            </button>

            <button
                class="controlButton"
                id="repeatButton">
                🔊 다시 듣기
            </button>

            <button
                class="controlButton end"
                id="endButton">
                인터뷰 종료
            </button>

        </div>


        <div id="systemStatus">
            SYSTEM : SOURCE LOCK ON
        </div>


        <div id="conversationLog"></div>

    </section>

</div>


<script>

/* =========================================================
   1. 정약용 자료
   ========================================================= */

/*
   중요:
   아래 자료 외의 역사적 사실을 임의로 추가하지 않는다.
*/

const historicalData = [

    {
        keywords: [
            "목민심서",
            "목민",
            "수령",
            "목민관"
        ],

        answer:
        "목민심서는 목민관, 곧 수령의 기본 자세를 다룬 책입니다. '목민'이란 백성을 다스린다는 뜻이지요. 제가 실제로 목민관으로 재직할 때 목민할 마음은 가졌지만 실천할 수 없었던 현실을 담아내어 지은 이름입니다."
    },


    {
        keywords: [
            "목민심서",
            "왜",
            "이유",
            "배경"
        ],

        answer:
        "목민심서는 제가 목민관으로 재직할 당시 목민할 마음은 가졌지만 실천할 수 없었던 현실을 담은 책입니다. 지방 수령으로서 지켜야 할 원칙과 규범을 담았으며, 백성에 대한 연민과 동정을 표현하였습니다. 또한 유교적 정치 질서 속에서 청렴과 애민으로 현실적인 문제를 해결하기 위한 대안을 제시한 책이기도 합니다."
    },


    {
        keywords: [
            "흠흠신서",
            "무엇",
            "어떤",
            "책"
        ],

        answer:
        "흠흠신서는 형사사건의 조사와 심리, 처형 과정을 다루는 관리들을 계몽하기 위해 집필한 책입니다. 당시 살인 사건의 조사와 심리, 처형 과정이 매우 형식적이고 무성의하게 진행되는 것에 관심을 가지게 되었고, 이를 바로잡고 계몽할 필요성을 느껴 집필에 착수하였습니다."
    },


    {
        keywords: [
            "비상전초",
            "청나라",
            "표본",
            "문서"
        ],

        answer:
        "비상전초는 살인사건의 문서를 작성하는 수령과 관찰사에게 모범을 제시하기 위해 청나라에서 발생한 비슷한 사건의 표본을 선별해 해설과 함께 비평한 것입니다. 살인사건 문서의 이상적인 형식과 문장 기법, 사실인정 기술과 관계 법례를 참고할 수 있도록 논술하였습니다."
    },


    {
        keywords: [
            "의율차례",
            "법규",
            "형량",
            "판례"
        ],

        answer:
        "의율차례는 당시 살인사건의 유형과 그에 적용되는 법규 및 형량이 세분되지 않아 죄의 경중이 무시되고 있던 사실에 착안한 것입니다. 중국의 모범적인 판례를 체계적으로 분류하여 제시하고 참고하도록 한 서적입니다."
    },


    {
        keywords: [
            "흠흠",
            "뜻",
            "의미"
        ],

        answer:
        "‘흠흠’이란 ‘매사에 삼가고 또 삼갈 일이다’라는 의미입니다. 재판을 정밀하고 자세하며 침착하고 무게 있게 처리해야 한다는 점을 강조하고자 책의 제목을 흠흠신서라고 지었습니다."
    },


    {
        keywords: [
            "서흥",
            "서흥현감",
            "김천의",
            "검시",
            "아전"
        ],

        answer:
        "말씀하신 것처럼 돈만 밝히는 아전이 너무나도 많았습니다만, 서흥 현감은 아랫사람들에게 맡기지 않고 검시 절차를 성심껏 밟아 그들과는 다른 모습을 보여주었습니다. 조사 방법이 탁월했을 뿐더러 보고서의 내용도 훌륭했습니다. 돈에 눈이 먼 자들 사이에서 서흥 현감과 같은 모범을 보여주는 현감을 찾기에는 사막에서 바늘 찾기였습니다."
    }

];


/* =========================================================
   2. HTML 요소
   ========================================================= */

const startScreen =
    document.getElementById("startScreen");

const mainScreen =
    document.getElementById("mainScreen");

const startButton =
    document.getElementById("startButton");

const voiceButton =
    document.getElementById("voiceButton");

const askButton =
    document.getElementById("askButton");

const repeatButton =
    document.getElementById("repeatButton");

const endButton =
    document.getElementById("endButton");

const questionInput =
    document.getElementById("questionInput");

const answerText =
    document.getElementById("answerText");

const character =
    document.getElementById("character");

const conversationLog =
    document.getElementById("conversationLog");

const systemStatus =
    document.getElementById("systemStatus");


/* =========================================================
   3. 현재 상태
   ========================================================= */

let currentAnswer =
    "반갑네. 궁금한 것이 있다면 물어보게.";

let recognition = null;

let isListening = false;


/* =========================================================
   4. 인터뷰 시작
   ========================================================= */

startButton.addEventListener("click", function() {

    startButton.disabled = true;

    startButton.textContent =
        "LOADING HISTORICAL SUBJECT...";

    setTimeout(function() {

        startScreen.style.display = "none";

        mainScreen.style.display = "block";

        systemStatus.textContent =
            "SYSTEM : SUBJECT IDENTIFICATION COMPLETE";

        currentAnswer =
            "반갑네. 궁금한 것이 있다면 물어보게.";

        answerText.textContent =
            currentAnswer;

        speak(currentAnswer);

    }, 1000);

});


/* =========================================================
   5. 질문 검색
   ========================================================= */

function findAnswer(question) {

    const normalizedQuestion =
        question.toLowerCase().trim();

    if (!normalizedQuestion) {

        return "질문을 들려주게.";

    }


    let bestAnswer = null;

    let bestScore = 0;


    for (const item of historicalData) {

        let score = 0;

        for (const keyword of item.keywords) {

            if (normalizedQuestion.includes(
                keyword.toLowerCase()
            )) {

                score++;

            }

        }


        if (score > bestScore) {

            bestScore = score;

            bestAnswer = item.answer;

        }

    }


    if (bestAnswer) {

        return bestAnswer;

    }


    return "그 부분에 대해서는 내가 아는 바가 없네. 이 인터뷰에 입력된 자료 안에서는 확인할 수 없는 내용이네.";

}


/* =========================================================
   6. 질문하기
   ========================================================= */

function askQuestion() {

    const question =
        questionInput.value.trim();


    if (!question) {

        answerText.textContent =
            "질문을 입력해 주게.";

        speak("질문을 입력해 주게.");

        return;

    }


    systemStatus.textContent =
        "SYSTEM : ANALYZING SOURCE DATA...";


    setTimeout(function() {

        const answer =
            findAnswer(question);


        currentAnswer =
            answer;


        answerText.textContent =
            answer;


        addConversation(
            question,
            answer
        );


        systemStatus.textContent =
            "SYSTEM : SOURCE LOCK ON";


        speak(answer);

    }, 400);

}


askButton.addEventListener(
    "click",
    askQuestion
);


/* =========================================================
   7. 엔터 대신 질문하기
   ========================================================= */

questionInput.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Enter" &&
            !event.shiftKey
        ) {

            event.preventDefault();

            askQuestion();

        }

    }
);


/* =========================================================
   8. 대화 기록
   ========================================================= */

function addConversation(
    question,
    answer
) {

    const item =
        document.createElement("div");

    item.className =
        "logItem";

    item.innerHTML =
        "<div class='logQuestion'>Q. "
        + escapeHTML(question)
        + "</div>"
        +
        "<div class='logAnswer'>A. "
        + escapeHTML(answer)
        + "</div>";

    conversationLog.prepend(item);

}


/* HTML 문자 안전 처리 */

function escapeHTML(text) {

    return text
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


/* =========================================================
   9. 음성 출력 TTS
   ========================================================= */

function speak(text) {

    if (!("speechSynthesis" in window)) {

        systemStatus.textContent =
            "SYSTEM : VOICE OUTPUT NOT SUPPORTED";

        return;

    }


    window.speechSynthesis.cancel();


    const utterance =
        new SpeechSynthesisUtterance(text);


    utterance.lang = "ko-KR";

    utterance.rate = 0.9;

    utterance.pitch = 0.8;

    utterance.volume = 1;


    utterance.onstart = function() {

        character.classList.add("speaking");

        systemStatus.textContent =
            "SYSTEM : JEONG YAG-YONG IS SPEAKING";

    };


    utterance.onend = function() {

        character.classList.remove("speaking");

        systemStatus.textContent =
            "SYSTEM : SOURCE LOCK ON";

    };


    utterance.onerror = function() {

        character.classList.remove("speaking");

        systemStatus.textContent =
            "SYSTEM : VOICE OUTPUT ERROR";

    };


    window.speechSynthesis.speak(
        utterance
    );

}


/* 다시 듣기 */

repeatButton.addEventListener(
    "click",
    function() {

        speak(currentAnswer);

    }
);


/* =========================================================
   10. 음성 인식
   ========================================================= */

const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;


if (SpeechRecognition) {

    recognition =
        new SpeechRecognition();


    recognition.lang =
        "ko-KR";


    recognition.continuous =
        false;


    recognition.interimResults =
        false;


    recognition.maxAlternatives =
        1;


    recognition.onstart =
        function() {

            isListening = true;

            voiceButton.textContent =
                "🔴 듣는 중...";

            systemStatus.textContent =
                "SYSTEM : VOICE RECOGNITION ACTIVE";

        };


    recognition.onresult =
        function(event) {

            const transcript =
                event.results[0][0].transcript;


            questionInput.value =
                transcript;


            systemStatus.textContent =
                "SYSTEM : QUESTION RECEIVED";


            /*
               음성 인식이 끝나면
               자동으로 질문하기
            */

            setTimeout(function() {

                askQuestion();

            }, 300);

        };


    recognition.onerror =
        function(event) {

            isListening = false;

            voiceButton.textContent =
                "🎤 음성 질문";

            systemStatus.textContent =
                "SYSTEM : VOICE RECOGNITION ERROR";


            if (
                event.error === "not-allowed"
            ) {

                answerText.textContent =
                    "마이크 사용 권한이 필요하네. Safari에서 마이크 사용을 허용해 주게.";

            }
            else if (
                event.error === "no-speech"
            ) {

                answerText.textContent =
                    "목소리가 들리지 않았네. 다시 한번 말해보게.";

            }
            else {

                answerText.textContent =
                    "음성 인식에 문제가 생겼네. 다시 시도해 보게.";

            }

        };


    recognition.onend =
        function() {

            isListening = false;

            voiceButton.textContent =
                "🎤 음성 질문";

            if (
                systemStatus.textContent ===
                "SYSTEM : VOICE RECOGNITION ACTIVE"
            ) {

                systemStatus.textContent =
                    "SYSTEM : SOURCE LOCK ON";

            }

        };


}
else {

    /*
       음성인식을 지원하지 않는 브라우저
    */

    voiceButton.addEventListener(
        "click",
        function() {

            answerText.textContent =
                "현재 사용 중인 브라우저에서는 음성 인식을 사용할 수 없네. 질문을 직접 입력해 주게.";

            systemStatus.textContent =
                "SYSTEM : VOICE RECOGNITION UNAVAILABLE";

        }
    );

}


/* 음성 질문 버튼 */

if (recognition) {

    voiceButton.addEventListener(
        "click",
        function() {

            if (isListening) {

                recognition.stop();

                return;

            }


            try {

                recognition.start();

            }
            catch(error) {

                systemStatus.textContent =
                    "SYSTEM : PLEASE TRY AGAIN";

            }

        }
    );

}


/* =========================================================
   11. 인터뷰 종료
   ========================================================= */

endButton.addEventListener(
    "click",
    function() {

        if (recognition && isListening) {

            recognition.stop();

        }


        window.speechSynthesis.cancel();


        character.classList.remove(
            "speaking"
        );


        mainScreen.style.display =
            "none";

        startScreen.style.display =
            "flex";


        startButton.disabled =
            false;

        startButton.textContent =
            "START INTERVIEW";


        questionInput.value =
            "";


        answerText.textContent =
            "반갑네. 궁금한 것이 있다면 물어보게.";


        conversationLog.innerHTML =
            "";


        currentAnswer =
            "반갑네. 궁금한 것이 있다면 물어보게.";

    }
);

</script>

</body>
</html>
